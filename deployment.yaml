
apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-monitor
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: equipment-monitor
  template:
    metadata:
      labels:
        app: equipment-monitor
    spec:
      containers:
        - name: dashboard
          image: YOUR_DOCKERHUB_USERNAME/industrial-predictive-maintenance:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: equipment-monitor-service
spec:
  type: NodePort
  selector:
    app: equipment-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
